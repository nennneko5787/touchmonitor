name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc-server:
    name: Build PC server (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touchmonitor-server-windows
          path: pc-server/target/release/touchmonitor-server.exe

  ios:
    name: Build iOS app (unsigned)
    # xcodegen's latest output uses the Xcode 16 project format, which the
    # Xcode 15 on macos-14 cannot open. macos-15 ships Xcode 16.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Use the runner's default Xcode (macos-15 ships Xcode 16).
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project TouchMonitor.xcodeproj \
            -scheme TouchMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify local-network permissions in built app
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'TouchMonitor.app' -path '*Release*' | head -1)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$APP/Info.plist" | grep -Fx '_touchmonitor._tcp'

      # Signing is skipped when secrets are absent, per project policy.
      - name: Repackage as .ipa (unsigned)
        run: |
          mkdir -p Payload
          cp -R "$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'TouchMonitor.app' -path '*Release*' | head -1)" Payload/
          zip -qr TouchMonitor-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TouchMonitor-ipa
          path: ios/TouchMonitor-unsigned.ipa

  release:
    name: Pre-release
    needs: [pc-server, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p assets
          cp artifacts/touchmonitor-server-windows/touchmonitor-server.exe assets/
          cp artifacts/TouchMonitor-ipa/TouchMonitor-unsigned.ipa assets/
          ls -la assets/

      # Unique tag per run so pre-releases never collide: v0.1.<run>-<shortsha>.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:10}"
          TAG="v0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          NOTES="Automated pre-release from CI run #${GITHUB_RUN_NUMBER}

          * touchmonitor-server.exe : PC-side capture/encode/multitouch server (Windows)
          * TouchMonitor-unsigned.ipa : iOS viewer app (unsigned; install via AltStore etc.)

          Note: USB tethering on a physical device is not yet verified."

          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "TouchMonitor v0.1.${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "$NOTES"
