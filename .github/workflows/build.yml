name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pc-server:
    name: Build PC server (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          working-directory: pc-server

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touchmonitor-server-windows
          path: pc-server/target/release/touchmonitor-server.exe

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Use the runner's default Xcode (macos-14 ships Xcode 15, which is fine).
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project TouchMonitor.xcodeproj \
            -scheme TouchMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Signing is skipped when secrets are absent, per project policy.
      - name: Repackage as .ipa (unsigned)
        run: |
          mkdir -p Payload
          cp -R "$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'TouchMonitor.app' -path '*Release*' | head -1)" Payload/
          zip -qr TouchMonitor-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TouchMonitor-ipa
          path: ios/TouchMonitor-unsigned.ipa
